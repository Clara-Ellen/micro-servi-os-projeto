spring.application.name=projeto-disciplinas
# 1. URL de Conexão com o nome correto do seu banco do SQLTools
spring.datasource.url=jdbc:postgresql://localhost:5432/projeto-curso

# 2. Usuário padrão do PostgreSQL
spring.datasource.username=postgres

# 3. DIGITE AQUI A SENHA que você criou quando instalou o Postgres na sua máquina
spring.datasource.password=santos3415

# 4. Configuração para o Spring criar as tabelas sozinho baseado no seu código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Adicione estas duas linhas abaixo para forçar a criação mesmo em modo enxuto:
spring.jpa.generate-ddl=true
spring.hibernate.initialization-mode=always

# 5. Mostra no terminal o Java criando as tabelas em tempo real
spring.jpa.show-sql=true

# 6. Mantém o Spring rodando de forma leve
spring.main.web-application-type=none
